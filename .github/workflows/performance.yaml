# 性能基准测试 Workflow
# 仅在 main 分支或 release 标签运行
# 用于运行 Criterion 基准测试并归档结果

name: Performance

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  performance:
    name: ⚡ Performance Benchmarks
    runs-on: ubuntu-latest
    # 只在 main 分支或 release 标签运行
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: 🔨 Build release binary
        run: cargo build --release

      - name: ⚡ Run benchmarks
        run: |
          # 运行所有基准测试，保存基线
          cargo bench --no-fail-fast -- --save-baseline ci-${{ github.sha }}

      - name: 📤 Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 90

      - name: 📊 Comment PR with benchmark results (可选)
        if: github.event_name == 'pull_request'
        run: |
          # 这里可以添加脚本，将性能结果评论到 PR
          echo "性能基准测试完成，结果已上传为 artifact"
