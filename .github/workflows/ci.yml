name: CI

on:
  pull_request:
    branches:
      - master
      - main
  # 允许手动触发 CI（用于测试或特殊情况）
  workflow_dispatch:

# 配置工作流权限，允许读取 PR 信息
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 检查是否应该跳过 CI（只检查版本更新分支）
  check-skip-ci:
    name: ⏭️ Check Skip CI
    env:
      # 使用 WORKFLOW_PAT 创建 PR，这样可以触发后续的 workflow
      WORKFLOW_USER_NAME: ${{ secrets.WORKFLOW_USER_NAME }}
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来检查提交者

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: 🔍 Check if version bump branch
        id: check
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_CREATOR: ${{ github.event.pull_request.user.login }}
          WORKFLOW_USER_NAME: ${{ env.WORKFLOW_USER_NAME }}
        run: |
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py ci check-skip \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --pr-creator "${{ github.event.pull_request.user.login }}" \
            --expected-user "${{ env.WORKFLOW_USER_NAME }}" \
            --ci
  # 代码质量检查（Lint）
  check-lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    needs: check-skip-ci
    # 跳过版本更新分支（bump-version-*）
    if: needs.check-skip-ci.outputs.should_skip != 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          # 优化 Windows 上的缓存性能
          enableCrossOsArchive: false

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: ✨ Check code formatting
        run: cargo fmt --check

      - name: 🔍 Run Clippy linter
        run: cargo clippy -- -D warnings

      - name: ✅ Verify compilation
        run: cargo check

  # 运行测试
  tests:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: check-skip-ci
    # 跳过版本更新分支（bump-version-*）
    if: needs.check-skip-ci.outputs.should_skip != 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          # 优化 Windows 上的缓存性能
          enableCrossOsArchive: false

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: 🧪 Run tests
        run: cargo test --verbose

  # 确保所有检查都通过（汇总 job）
  # 这个 job 依赖于 check-lint 和 tests，检查所有必需检查的状态
  # 如果任何检查失败，此 job 会失败，从而阻止 PR 合并
  # 注意：需要在 GitHub 仓库设置中配置分支保护规则，将此工作流设为必需的状态检查
  # 状态检查名称：CI / ✅ Verify All Checks
  # 注意：job 名称必须与分支保护规则中配置的状态检查名称匹配
  check-status:
    name: ✅ Verify All Checks
    runs-on: ubuntu-latest
    # 对于所有 PR 都运行此 job，包括版本更新分支的情况
    # 这样 GitHub 会报告状态，满足分支保护规则的要求
    # 使用 always() 确保即使依赖的 job 失败或跳过，此 job 也会运行
    needs: [check-skip-ci, check-lint, tests]
    if: always()
    steps:
      - name: ✅ Check lint and test status
        id: status_check
        run: |
          set +e  # 允许命令失败，继续执行

          # 获取所有相关 job 的结果（如果 job 未运行，result 可能为空）
          SKIP_CI_RESULT="${{ needs.check-skip-ci.result }}"
          SKIP_CI_SHOULD_SKIP="${{ needs.check-skip-ci.outputs.should_skip }}"
          LINT_RESULT="${{ needs.check-lint.result }}"
          TEST_RESULT="${{ needs.tests.result }}"

          echo "📊 Checking job status:"
          echo "  check-skip-ci: $SKIP_CI_RESULT (should_skip: $SKIP_CI_SHOULD_SKIP)"
          echo "  check-lint: $LINT_RESULT"
          echo "  tests: $TEST_RESULT"

          # 优先级1: 如果 check-skip-ci 成功且 should_skip 为 true，说明应该跳过 CI
          if [ "$SKIP_CI_RESULT" == "success" ] && [ "$SKIP_CI_SHOULD_SKIP" == "true" ]; then
            echo "✅ CI should be skipped for version bump branch"
            exit 0
          fi

          # 优先级2: 如果 check-lint 和 tests 都被跳过，说明应该跳过 CI
          if [ "$LINT_RESULT" == "skipped" ] && [ "$TEST_RESULT" == "skipped" ]; then
            echo "✅ CI checks were skipped"
            exit 0
          fi

          # 检查 check-skip-ci 是否失败（这不应该发生，但需要处理）
          if [ "$SKIP_CI_RESULT" == "failure" ]; then
            echo "❌ check-skip-ci failed"
            exit 1
          fi

          # 检查 check-lint 状态
          if [ -n "$LINT_RESULT" ]; then
            if [ "$LINT_RESULT" == "failure" ] || [ "$LINT_RESULT" == "cancelled" ]; then
              echo "❌ Lint check failed: $LINT_RESULT"
              exit 1
            elif [ "$LINT_RESULT" != "success" ] && [ "$LINT_RESULT" != "skipped" ]; then
              echo "❌ Lint check has unexpected status: $LINT_RESULT"
              exit 1
            fi
          fi

          # 检查 tests 状态
          if [ -n "$TEST_RESULT" ]; then
            if [ "$TEST_RESULT" == "failure" ] || [ "$TEST_RESULT" == "cancelled" ]; then
              echo "❌ Test check failed: $TEST_RESULT"
              exit 1
            elif [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "skipped" ]; then
              echo "❌ Test check has unexpected status: $TEST_RESULT"
              exit 1
            fi
          fi

          # 如果 check-lint 和 tests 都成功或被跳过，则通过
          if [ "$LINT_RESULT" == "success" ] || [ "$LINT_RESULT" == "skipped" ]; then
            if [ "$TEST_RESULT" == "success" ] || [ "$TEST_RESULT" == "skipped" ]; then
              echo "✅ All checks passed or were skipped"
              exit 0
            fi
          fi

          # 如果到达这里，说明有未处理的状况
          echo "⚠️  Unexpected state: lint=$LINT_RESULT, test=$TEST_RESULT"
          echo "   This should not happen. Please check the workflow configuration."
          exit 1
