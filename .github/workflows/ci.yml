name: CI

on:
  pull_request:
    branches:
      - master
      - main
  # 允许手动触发 CI（用于测试或特殊情况）
  workflow_dispatch:

# 配置工作流权限，允许读取 PR 信息和写入评论
permissions:
  contents: read
  pull-requests: write  # 需要写入权限以添加 PR 评论
  issues: write         # PR 评论使用 issues API

env:
  CARGO_TERM_COLOR: always

jobs:
  # 检查是否应该跳过 CI（只检查版本更新分支）
  check-skip-ci:
    name: ⏭️ Check Skip CI
    env:
      # 使用 WORKFLOW_PAT 创建 PR，这样可以触发后续的 workflow
      WORKFLOW_USER_NAME: ${{ secrets.WORKFLOW_USER_NAME }}
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来检查提交者

      - name: 🔍 Verify Git is available
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            echo "❌ Error: Git is required but not found"
            echo "Installing Git..."
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y git
            elif [[ "${{ runner.os }}" == "macOS" ]]; then
              if ! brew list git >/dev/null 2>&1; then
                brew install git || echo "⚠️  Git installation failed, but may be pre-installed"
              fi
            elif [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "⚠️  Git should be pre-installed on Windows runner"
            fi
          fi
          git --version
          echo "✅ Git is available"

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: 🔍 Check if version bump branch
        id: check
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_CREATOR: ${{ github.event.pull_request.user.login }}
          WORKFLOW_USER_NAME: ${{ env.WORKFLOW_USER_NAME }}
        run: |
          # 使用 Python dev 工具
                 python3 scripts/dev/py/dev.py ci check-skip \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --pr-creator "${{ github.event.pull_request.user.login }}" \
            --expected-user "${{ env.WORKFLOW_USER_NAME }}" \
            --ci

  # 代码质量检查（Lint）
  check-lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    needs: [check-skip-ci]
    # 跳过版本更新分支（bump-version-*）
    if: needs.check-skip-ci.outputs.should_skip != 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          # 优化 Windows 上的缓存性能
          enableCrossOsArchive: false

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: ✨ Check code formatting
        run: cargo fmt --check

      - name: 🔍 Run Clippy linter
        run: cargo clippy -- -D warnings

      - name: ✅ Verify compilation
        run: cargo check

  # 运行单元测试、模块测试、端到端测试和文档测试（跨平台并行执行，分层测试策略）
  tests:
    name: 🧪 Run Tests (${{ matrix.test_type }}) (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [check-skip-ci]
    # 跳过版本更新分支（bump-version-*）
    if: needs.check-skip-ci.outputs.should_skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 单元测试
          - os: ubuntu-latest
            platform: Linux-x86_64
            test_type: unit
            test_timeout: 20
            test_command: cargo test --lib --verbose
          - os: macos-latest
            platform: macOS
            test_type: unit
            test_timeout: 25
            test_command: cargo test --lib --verbose
          - os: windows-latest
            platform: Windows-x86_64
            test_type: unit
            test_timeout: 25
            test_command: cargo test --lib --verbose
          # 模块级集成测试（module_test）
          - os: ubuntu-latest
            platform: Linux-x86_64
            test_type: module
            test_timeout: 20
            test_command: cargo test --test module_test --verbose
          - os: macos-latest
            platform: macOS
            test_type: module
            test_timeout: 25
            test_command: cargo test --test module_test --verbose
          - os: windows-latest
            platform: Windows-x86_64
            test_type: module
            test_timeout: 25
            test_command: cargo test --test module_test --verbose
          # 端到端集成测试（e2e_test）
          - os: ubuntu-latest
            platform: Linux-x86_64
            test_type: e2e
            test_timeout: 30
            test_command: cargo test --test e2e_test --verbose
          - os: macos-latest
            platform: macOS
            test_type: e2e
            test_timeout: 40
            test_command: cargo test --test e2e_test --verbose
          - os: windows-latest
            platform: Windows-x86_64
            test_type: e2e
            test_timeout: 35
            test_command: cargo test --test e2e_test --verbose
          # 文档测试
          - os: ubuntu-latest
            platform: Linux-x86_64
            test_type: doctest
            test_timeout: 12
            test_command: cargo test --doc --verbose
          - os: macos-latest
            platform: macOS
            test_type: doctest
            test_timeout: 12
            test_command: cargo test --doc --verbose
          - os: windows-latest
            platform: Windows-x86_64
            test_type: doctest
            test_timeout: 12
            test_command: cargo test --doc --verbose
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          # 优化 Windows 上的缓存性能
          enableCrossOsArchive: false

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🧪 Run ${{ matrix.test_type }} tests
        timeout-minutes: ${{ matrix.test_timeout }}
        id: test_run
        shell: bash
        run: |
          echo "🧪 Running ${{ matrix.test_type }} tests on ${{ matrix.platform }}..."
          # 记录测试开始时间（Unix 时间戳）
          START_TIME=$(date +%s 2>/dev/null || echo "0")
          # 运行测试并记录输出到文件（用于性能分析和报告生成）
          # 使用 --message-format=json 以便生成测试报告
          ${{ matrix.test_command }} --message-format=json 2>&1 | tee test-output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          # 记录测试结束时间并计算持续时间
          END_TIME=$(date +%s 2>/dev/null || echo "0")
          if [ "$START_TIME" != "0" ] && [ "$END_TIME" != "0" ]; then
            DURATION=$((END_TIME - START_TIME))
            echo "⏱️  Test duration: ${DURATION} seconds"
            echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          else
            echo "⏱️  Test duration: Unable to calculate (platform: ${{ runner.os }})"
            echo "duration=0" >> $GITHUB_OUTPUT
          fi
          # 检查是否有慢测试（超过50秒的测试）
          if grep -E "test.*took.*[5-9][0-9]\.|test.*took.*[0-9]{3,}\." test-output.log 2>/dev/null; then
            echo "⚠️  Warning: Found slow tests (>50 seconds)"
            echo "slow_tests=true" >> $GITHUB_OUTPUT
          else
            echo "slow_tests=false" >> $GITHUB_OUTPUT
          fi
          exit $TEST_EXIT_CODE

      - name: ⚠️  Report slow tests
        if: steps.test_run.outputs.slow_tests == 'true'
        run: |
          echo "::warning::Found slow tests in ${{ matrix.test_type }} tests"
          echo "Test duration: ${{ steps.test_run.outputs.duration }} seconds"
          echo "Please review slow tests and consider optimization"

      - name: 📊 Generate test report
        if: always()
        continue-on-error: true
        id: generate_report
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          echo "📊 Generating test report..."
          # 检查 Python 是否可用
          if ! command -v python3 >/dev/null 2>&1; then
            echo "⚠️  Python3 not found, skipping test report generation"
            echo "json_report_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查 test-output.log 是否存在
          if [ ! -f "test-output.log" ]; then
            echo "⚠️  test-output.log not found, skipping test report generation"
            echo "json_report_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查是否有 JSON 格式的测试输出
          JSON_LINES=$(grep -c '^{' test-output.log 2>/dev/null || echo "0")
          if [ "$JSON_LINES" -eq "0" ]; then
            echo "⚠️  No JSON test output found in test-output.log"
            echo "json_report_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found $JSON_LINES JSON lines in test-output.log"

          # 从 test-output.log 中提取 JSON 格式的测试输出并生成报告
          REPORT_FILE="test-report-${{ matrix.test_type }}-${{ matrix.platform }}.html"
          JSON_REPORT_FILE="test-report-${{ matrix.test_type }}-${{ matrix.platform }}.json"

          # 使用 Python dev 工具生成 HTML 报告
          if grep '^{' test-output.log 2>/dev/null | \
            python3 scripts/dev/py/dev.py tests report generate \
              --format html \
              --output "$REPORT_FILE" 2>&1; then
            echo "✅ HTML report generated: $REPORT_FILE"
            echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Failed to generate HTML report, continuing..."
            echo "report_file=" >> $GITHUB_OUTPUT
          fi

          # 同时生成 JSON 报告用于 PR 评论
          if grep '^{' test-output.log 2>/dev/null | \
            python3 scripts/dev/py/dev.py tests report generate \
              --format json \
              --output "$JSON_REPORT_FILE" 2>&1; then
            if [ -f "$JSON_REPORT_FILE" ]; then
              echo "✅ JSON report generated: $JSON_REPORT_FILE"
              echo "json_report_file=$JSON_REPORT_FILE" >> $GITHUB_OUTPUT
              echo "json_report_exists=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️  JSON report generation succeeded but file not found"
              echo "json_report_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️  Failed to generate JSON report"
            echo "json_report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload test report
        if: always() && steps.test_run.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.test_type }}-${{ matrix.platform }}
          path: test-report-*.html
          retention-days: 7
          if-no-files-found: ignore

      - name: 📤 Upload JSON test report
        if: always() && steps.test_run.outcome != 'skipped' && steps.generate_report.outputs.json_report_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-json-${{ matrix.test_type }}-${{ matrix.platform }}
          path: test-report-${{ matrix.test_type }}-${{ matrix.platform }}.json
          retention-days: 7
          if-no-files-found: warn

      - name: 📊 Collect test metrics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "📊 Collecting test metrics..."

          if ! command -v python3 >/dev/null 2>&1; then
            echo "⚠️  Python3 not found, skipping metrics collection"
            exit 0
          fi

          # 收集指标
          METRICS_DIR="test-metrics"
          mkdir -p "$METRICS_DIR"

          JSON_REPORT_FILE="test-report-${{ matrix.test_type }}-${{ matrix.platform }}.json"
          if [ -f "$JSON_REPORT_FILE" ]; then
            # 使用 Python dev 工具
            python3 scripts/dev/py/dev.py tests metrics collect \
              --report "$JSON_REPORT_FILE" \
              --output "$METRICS_DIR/metrics-${{ matrix.test_type }}-${{ matrix.platform }}-${{ github.run_id }}.json"
          fi

          echo "metrics_dir=$METRICS_DIR" >> $GITHUB_OUTPUT

      - name: 📤 Upload test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-${{ matrix.test_type }}-${{ matrix.platform }}
          path: test-metrics/*.json
          retention-days: 90
          if-no-files-found: ignore

      - name: ⚡ Analyze performance regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "⚡ Analyzing performance regression..."

          if ! command -v python3 >/dev/null 2>&1; then
            echo "⚠️  Python3 not found, skipping performance analysis"
            exit 0
          fi

          JSON_REPORT_FILE="test-report-${{ matrix.test_type }}-${{ matrix.platform }}.json"
          if [ ! -f "$JSON_REPORT_FILE" ]; then
            echo "⚠️  Test report not found, skipping"
            exit 0
          fi

          # 基准文件路径（从 Artifacts 下载或使用当前作为基准）
          BASELINE_FILE="performance-baseline-${{ matrix.test_type }}-${{ matrix.platform }}.json"

          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py performance analyze \
            --current "$JSON_REPORT_FILE" \
            --baseline "$BASELINE_FILE" \
            --output "performance-regression-report.md" \
            --threshold 0.2 || {
            echo "⚠️  Performance regression detected, but continuing..."
          }

          # 更新基准（如果当前性能更好或首次运行）
          if [ ! -f "$BASELINE_FILE" ] || [ "${{ steps.test_run.outcome }}" == "success" ]; then
            cp "$JSON_REPORT_FILE" "$BASELINE_FILE"
            echo "✅ Performance baseline updated"
          fi

      - name: 📤 Upload performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ matrix.test_type }}-${{ matrix.platform }}
          path: performance-baseline-*.json
          retention-days: 90
          if-no-files-found: ignore

      - name: ✅ Run completion completeness tests
        if: matrix.test_type == 'unit'
        timeout-minutes: ${{ matrix.test_timeout }}
        run: cargo test --test completeness --verbose

  # 注意：测试覆盖率检查已移至 coverage-check.yml workflow（定时运行）
  # 注意：被忽略的测试需要交互，不适合在 CI 中运行
  # 注意：文档检查（check-docs 和 check-links）已移至 doc-consistency-check.yml workflow
  # 该 workflow 支持 PR 触发和定期检查，功能更完整

  # 构建验证：验证代码可以在所有平台上正确构建
  build:
    name: 🔨 Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [check-skip-ci, tests]
    # 跳过版本更新分支（bump-version-*）
    if: needs.check-skip-ci.outputs.should_skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macOS-Intel
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-AppleSilicon
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux-x86_64-static
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: Windows-x86_64-MinGW
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 📦 Install MinGW toolchain (Windows)
        if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          # GitHub Actions Windows runner 通常已预装 MinGW
          # 如果没有，可以通过 rustup 安装，或使用预装的工具链
          # 检查 MinGW 是否可用
          if (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue) {
            Write-Host "✅ MinGW toolchain already available"
          } else {
            Write-Host "⚠️  MinGW toolchain not found, attempting to install..."
            # 尝试通过 Chocolatey 安装（如果可用）
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install mingw -y
            } else {
              Write-Host "⚠️  Chocolatey not available, MinGW may need manual installation"
            }
          }

      - name: 📦 Install system dependencies (Linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # 安装 XCB 开发库（clipboard 依赖）
          # xcb crate 需要 xcb-proto 来生成代码模块（xproto, big_requests, etc.）
          # xcb-proto 需要 Python 来运行代码生成脚本
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-xcbgen \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            xcb-proto \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xinerama0-dev \
            libxcb-randr0-dev \
            libxcb-xinput-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-xv0-dev \
            libxcb-glx0-dev \
            libxcb-shm0-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-record0-dev \
            libxcb-screensaver0-dev \
            libxcb-res0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
          # 基本验证：检查关键依赖是否可用
          python3 -c "import xcbgen" || (echo "❌ Error: xcbgen module not available" && exit 1)
          pkg-config --exists xcb || (echo "❌ Error: xcb pkg-config not found" && exit 1)
          echo "✅ xcb dependencies verified"

      - name: 📦 Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # 检查 pkg-config 是否已安装，避免重复安装警告
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          else
            echo "✅ pkg-config is already installed"
          fi

      - name: 🔍 Get Cargo.lock hash
        id: cargo_lock
        shell: bash
        run: |
          if [ -f "Cargo.lock" ]; then
            # macOS 使用 shasum，Linux 使用 sha256sum
            if command -v shasum >/dev/null 2>&1; then
              HASH=$(shasum -a 256 Cargo.lock | cut -d' ' -f1 | head -c 16)
            else
              HASH=$(sha256sum Cargo.lock | cut -d' ' -f1 | head -c 16)
            fi
            echo "hash=$HASH" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.cargo_lock.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          enableCrossOsArchive: false

      - name: 🔨 Build binaries (验证构建)
        shell: bash
        run: |
          # 对于 Linux x86_64，设置环境变量以支持 xcb 构建
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            export XCB_PROTO_DIR="${XCB_PROTO_DIR:-/usr/share/xcb}"
            export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            # 确保 PYTHONPATH 包含 xcbgen 模块路径
            if ! python3 -c "import xcbgen" 2>/dev/null; then
              XCBGEN_DIR=$(python3 -c "import xcbgen; import os; print(os.path.dirname(xcbgen.__file__))" 2>/dev/null || find /usr -name "xcbgen" -type d 2>/dev/null | head -1)
              if [ -n "$XCBGEN_DIR" ]; then
                export PYTHONPATH="$(dirname $XCBGEN_DIR):${PYTHONPATH:-}"
              fi
            fi
            # 基本验证
            python3 -c "import xcbgen" || (echo "❌ Error: xcbgen module not available" && exit 1)
            pkg-config --exists xcb || (echo "❌ Error: xcb pkg-config not found" && exit 1)
          fi

          # 构建项目（只验证构建，不打包）
          echo "🔨 Building for ${{ matrix.platform }} (${{ matrix.target }})..."
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            # Linux x86_64 使用详细输出以便调试
            if cargo build --release --target ${{ matrix.target }} --bin workflow --bin install -vv 2>&1 | tee build.log; then
              BUILD_SUCCESS=true
            else
              BUILD_SUCCESS=false
              echo "❌ Build failed. Checking build log for xcb-related errors..."
              grep -i "xcb\|xproto\|xcbgen" build.log | head -20 || true
            fi
          elif [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            # Linux musl 静态链接版本
            echo "🔨 Building for Linux musl (static linking)..."
            if cargo build --release --target ${{ matrix.target }} --bin workflow --bin install; then
              BUILD_SUCCESS=true
            else
              BUILD_SUCCESS=false
              echo "❌ Build failed for Linux musl"
            fi
          else
            # 其他目标（macOS, Windows MSVC, Windows MinGW）
            if cargo build --release --target ${{ matrix.target }} --bin workflow --bin install; then
              BUILD_SUCCESS=true
            else
              BUILD_SUCCESS=false
            fi
          fi

          # 如果构建失败，退出并返回错误码
          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "❌ Build verification failed for ${{ matrix.platform }}"
            exit 1
          fi

          echo "✅ Build verification passed for ${{ matrix.platform }}"

  # 生成 PR 评论（汇总所有测试结果）
  # 这个 job 在所有测试完成后运行，汇总结果并添加 PR 评论
  pr-comment:
    name: 💬 Comment Test Results on PR
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'pull_request' && always()
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📥 Download all test reports
        id: download_reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-report-json-*
          merge-multiple: false

      - name: 🔍 Debug downloaded artifacts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "🔍 Checking for downloaded test reports..."
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -la || true
          echo ""
          echo "Searching for JSON report files:"
          find . -name "test-report-*.json" -type f 2>/dev/null | head -20 || echo "No JSON files found"
          echo ""
          echo "Artifact download step outcome: ${{ steps.download_reports.outcome }}"

      - name: 📊 Generate PR comment
        id: generate_comment
        continue-on-error: true
        shell: bash
        run: |
          echo "📊 Generating PR comment..."

          # 检查 Python 是否可用
          if ! command -v python3 >/dev/null 2>&1; then
            echo "⚠️  Python3 not found, skipping PR comment generation"
            exit 0
          fi

          # 查找所有 JSON 报告文件
          JSON_FILES=$(find . -name "test-report-*.json" -type f 2>/dev/null)

          if [ -z "$JSON_FILES" ]; then
            echo "⚠️  No JSON test reports found, skipping PR comment"
            exit 0
          fi

          # 合并所有报告（支持多平台）
          echo "Found JSON reports:"
          echo "$JSON_FILES"

          # 生成 PR 评论内容（合并所有报告）
          COMMENT_FILE="pr-comment.md"
          # 构建命令参数（每个报告文件都需要 --report 前缀）
          CMD_ARGS="--comment --format markdown --output $COMMENT_FILE"
          for json_file in $JSON_FILES; do
            CMD_ARGS="$CMD_ARGS --report $json_file"
          done

          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py tests report generate $CMD_ARGS || {
            echo "⚠️  Failed to generate PR comment, continuing..."
            exit 0
          }

          # 将评论内容保存到输出（用于后续步骤）
          echo "comment_file=$COMMENT_FILE" >> $GITHUB_OUTPUT
          echo "✅ PR comment generated"

      - name: 💬 Comment on PR
        if: steps.generate_comment.outputs.comment_file != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentFile = '${{ steps.generate_comment.outputs.comment_file }}';

            if (!fs.existsSync(commentFile)) {
              console.log('⚠️  Comment file not found, skipping');
              return;
            }

            const commentBody = fs.readFileSync(commentFile, 'utf8');
            const prNumber = context.issue.number;

            console.log(`📝 Posting comment on PR #${prNumber}`);

            // 查找是否已有测试结果评论
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            // 查找由 bot 创建的测试结果评论
            const botComment = comments.data.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Test Results Summary')
            );

            if (botComment) {
              // 更新现有评论
              console.log(`🔄 Updating existing comment #${botComment.id}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log('✅ Comment updated');
            } else {
              // 创建新评论
              console.log('✨ Creating new comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log('✅ Comment created');
            }

  # 测试趋势分析（在所有测试完成后运行）
  # 只在所有测试成功时运行，因为测试失败时趋势分析意义不大
  test-trends:
    name: 📈 Analyze Test Trends
    runs-on: ubuntu-latest
    needs: [tests]
    if: needs.tests.result == 'success'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📥 Download test metrics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-metrics-*
          merge-multiple: false

      - name: 📊 Analyze trends
        continue-on-error: true
        shell: bash
        run: |
          echo "📊 Analyzing test trends..."

          if ! command -v python3 >/dev/null 2>&1; then
            echo "⚠️  Python3 not found, skipping trend analysis"
            exit 0
          fi

          # 收集所有指标文件
          METRICS_DIR="all-metrics"
          mkdir -p "$METRICS_DIR"
          find . -name "metrics-*.json" -type f -exec cp {} "$METRICS_DIR/" \; 2>/dev/null || true

          # 使用 Python dev 工具（即使没有指标也会生成报告）
          python3 scripts/dev/py/dev.py tests trends analyze \
            --metrics-dir "$METRICS_DIR" \
            --output "test-trends-report.md" || {
            echo "⚠️  Failed to generate trend report, creating empty report..."
            # 如果脚本失败，创建一个空报告文件
            mkdir -p "$(dirname test-trends-report.md)"
            echo "# Test Trends Report" > test-trends-report.md
            echo "" >> test-trends-report.md
            echo "**Generated**: $(date -u +"%Y-%m-%d %H:%M:%S")" >> test-trends-report.md
            echo "" >> test-trends-report.md
            echo "## Error" >> test-trends-report.md
            echo "" >> test-trends-report.md
            echo "Failed to generate trend report. This may happen if:" >> test-trends-report.md
            echo "- Test metrics were not collected" >> test-trends-report.md
            echo "- Metrics artifacts were not downloaded" >> test-trends-report.md
            echo "- An error occurred during analysis" >> test-trends-report.md
          }

          # 确保报告文件存在
          if [ ! -f "test-trends-report.md" ]; then
            echo "⚠️  Report file was not created, creating empty report..."
            echo "# Test Trends Report" > test-trends-report.md
            echo "" >> test-trends-report.md
            echo "**Generated**: $(date -u +"%Y-%m-%d %H:%M:%S")" >> test-trends-report.md
            echo "" >> test-trends-report.md
            echo "## No Report Available" >> test-trends-report.md
            echo "" >> test-trends-report.md
            echo "The trend report could not be generated." >> test-trends-report.md
          fi

          echo "trend_report=test-trends-report.md" >> $GITHUB_OUTPUT

      - name: 📤 Upload trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-trends-report
          path: test-trends-report.md
          retention-days: 30
          if-no-files-found: ignore

  # 确保所有检查都通过（汇总 job）
  # 这个 job 依赖于 check-lint 和 tests，检查所有必需检查的状态
  # 如果任何检查失败，此 job 会失败，从而阻止 PR 合并
  # 注意：需要在 GitHub 仓库设置中配置分支保护规则，将此工作流设为必需的状态检查
  # 状态检查名称：CI / ✅ Verify All Checks
  # 注意：job 名称必须与分支保护规则中配置的状态检查名称匹配
  # 注意：文档检查已移至 doc-consistency-check.yml workflow
  check-status:
    name: ✅ Verify All Checks
    runs-on: ubuntu-latest
    # 对于所有 PR 都运行此 job，包括版本更新分支的情况
    # 这样 GitHub 会报告状态，满足分支保护规则的要求
    # 使用 always() 确保即使依赖的 job 失败或跳过，此 job 也会运行
    needs: [check-skip-ci, check-lint, tests, build]
    if: always()
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: ✅ Check lint and test status
        id: status_check
        env:
          should_skip: ${{ needs.check-skip-ci.outputs.should_skip }}
          CHECK_LINT_RESULT: ${{ needs.check-lint.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py ci verify \
            --should-skip ${{ needs.check-skip-ci.outputs.should_skip == 'true' }} \
            --jobs "check-lint,tests,build"
