name: Release

on:
  push:
    branches:
      - master  # 当合并到 master 分支时触发
      # 排除 bump-version-* 分支，避免触发 release workflow
      - '!bump-version-*'
  workflow_dispatch:  # 允许手动触发（仅非 master 分支）

# 统一 workflow run 的显示名称
# 策略：
# - 对于 push 事件（PR merge），不设置 run-name，让 GitHub 自动使用 PR 标题
# - 对于 workflow_dispatch，使用自定义名称
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release - {0} (manual)', github.ref_name) || '' }}

# 并发控制：仅对 master 分支限制并发，确保同一时间只有一个 release
# - Master 分支：所有 release 共享同一个 group，确保按顺序执行
# - 非 Master 分支：每个分支使用不同的 group，允许多个并发
concurrency:
  group: release-workflow-${{ github.ref == 'refs/heads/master' && 'master' || github.ref_name }}
  cancel-in-progress: false  # 不取消正在运行的，让新的等待

permissions:
  contents: write  # 允许创建 Release 和上传文件
  pull-requests: write  # 允许创建 PR（用于版本更新）
  statuses: write  # 允许创建状态检查（用于满足分支保护规则）

env:
  CARGO_TERM_COLOR: always

jobs:
  # 代码质量检查（Lint）
  check-lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          # 优化 Windows 上的缓存性能：禁用跨 OS 归档可以避免 Windows 路径问题
          enableCrossOsArchive: false

      - name: ✨ Check code formatting
        run: cargo fmt --check

      - name: 🔍 Run Clippy linter
        run: cargo clippy -- -D warnings

      - name: ✅ Verify compilation
        run: cargo check
  #
  # 运行测试（跨平台并行执行）
  tests:
    name: 🧪 Run Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: |
      (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux-x86_64
            test_timeout: 25
          - os: macos-latest
            platform: macOS
            test_timeout: 35
          - os: windows-latest
            platform: Windows-x86_64
            test_timeout: 30
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          # 优化 Windows 上的缓存性能：禁用跨 OS 归档可以避免 Windows 路径问题
          enableCrossOsArchive: false

      - name: 📦 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: 🧪 Run tests
        timeout-minutes: ${{ matrix.test_timeout }}
        run: cargo test --verbose

  # 性能基准测试
  check-performance:
    name: ⚡ Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [check-status]
    if: |
      (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          enableCrossOsArchive: false

      - name: 📦 Install system dependencies (Linux)
        run: bash scripts/dev/shell/deps/install-basic.sh

      - name: ⚡ Run performance benchmarks
        run: |
          cargo bench --bench cli_performance \
            --bench core_operations \
            --bench network_operations

      - name: 📤 Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks-${{ github.run_id }}
          path: target/criterion/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 Performance summary
        if: always()
        run: |
          if [ -d "target/criterion" ]; then
            echo "⚡ Performance benchmarks completed"
            echo "Reports available in target/criterion/"
          else
            echo "⚠️  Performance benchmarks did not generate reports"
          fi

  #
  # 确保所有检查都通过（汇总 job）
  # 这个 job 依赖于 check-lint 和 tests，检查所有必需检查的状态
  # 如果任何检查失败，此 job 会失败，从而阻止后续操作
  # 注意：需要在 GitHub 仓库设置中配置分支保护规则，将此工作流设为必需的状态检查
  check-status:
    name: ✅ Verify All Checks
    runs-on: ubuntu-latest
    needs: [check-lint, tests]
    if: |
      (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    steps:
      - name: Check lint and test status
        run: |
          if [ "${{ needs.check-lint.result }}" != "success" ] || [ "${{ needs.tests.result }}" != "success" ]; then
            echo "❌ Some checks failed:"
            echo "  Lint: ${{ needs.check-lint.result }}"
            echo "  Test: ${{ needs.tests.result }}"
            echo ""
            echo "Cannot proceed until all checks pass."
            exit 1
          fi
          echo "✅ All checks passed!"

  # 生成版本号并更新 Cargo.toml 和 Cargo.lock
  update-version:
    name: 📦 Generate Version
    runs-on: ubuntu-latest
    needs: [check-status]
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master') ||
      (github.ref == 'refs/heads/master' && github.event_name == 'push')
    permissions:
      contents: read  # 只需要读取权限
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      tag: ${{ steps.generate_version.outputs.tag }}
      needs_increment: ${{ steps.generate_version.outputs.needs_increment }}
      is_master_branch: ${{ steps.detect_mode.outputs.is_master_branch }}
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史记录来检查 tag
          # 使用默认的 GITHUB_TOKEN，有 contents: write 权限，可以推送 tag

      - name: 🔍 Verify Git is available
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            echo "❌ Error: Git is required but not found"
            echo "Installing Git..."
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y git
            elif [[ "${{ runner.os }}" == "macOS" ]]; then
              # macOS runner 通常已预装 git，但验证一下
              if ! brew list git >/dev/null 2>&1; then
                brew install git || echo "⚠️  Git installation failed, but may be pre-installed"
              fi
            elif [[ "${{ runner.os }}" == "Windows" ]]; then
              # Windows runner 通常已预装 git
              echo "⚠️  Git should be pre-installed on Windows runner"
            fi
          fi
          git --version
          echo "✅ Git is available"

      - name: 🔍 Get latest version from git tags
        id: get_latest_version
        shell: bash
        run: |
          # 从 git tags 获取最新的标准版本号（排除 alpha/beta 预发布版本）
          # 获取所有标准版本 tag（格式：vx.x.x），按版本号排序
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            # 如果没有找到标准版本 tag，使用默认版本
            LATEST_VERSION="0.0.0"
            echo "⚠️  No standard version tag found, using default: $LATEST_VERSION"
          else
            # 移除 v 前缀
            LATEST_VERSION=${LATEST_TAG#v}
            echo "✅ Latest standard version from git tags: $LATEST_TAG ($LATEST_VERSION)"
          fi

          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: 🎯 Detect branch type and trigger mode
        id: detect_mode
        shell: bash
        run: |
          set -e
          # 检测是否是 master 分支
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            IS_MASTER_BRANCH="true"
          else
            IS_MASTER_BRANCH="false"
          fi

          # 检测触发类型
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IS_MANUAL_TRIGGER="true"
          else
            IS_MANUAL_TRIGGER="false"
          fi

          echo "is_master_branch=$IS_MASTER_BRANCH" >> $GITHUB_OUTPUT
          echo "is_manual_trigger=$IS_MANUAL_TRIGGER" >> $GITHUB_OUTPUT

          echo "✅ Branch detection completed:"
          echo "   Branch: ${{ github.ref }}"
          echo "   Is Master: $IS_MASTER_BRANCH"
          echo "   Event: ${{ github.event_name }}"
          echo "   Is Manual: $IS_MANUAL_TRIGGER"

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 Generate version number
        id: generate_version
        run: |
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py version generate \
            --master ${{ steps.detect_mode.outputs.is_master_branch == 'true' }} \
            --ci

      - name: 📝 Update Cargo.toml and Cargo.lock version
        if: steps.generate_version.outputs.needs_increment == 'true' && steps.detect_mode.outputs.is_master_branch == 'true'
        shell: bash
        run: |
          NEW_VERSION="${{ steps.generate_version.outputs.version }}"

          # 更新 Cargo.toml 中的版本号
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          fi

          # 验证 Cargo.toml 更新
          UPDATED_VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          if [ "$UPDATED_VERSION" != "$NEW_VERSION" ]; then
            echo "❌ Error: Failed to update version in Cargo.toml"
            exit 1
          fi

          # 更新 Cargo.lock 中的版本号
          if grep -q 'name = "workflow"' Cargo.lock; then
            if [[ "$OSTYPE" == "darwin"* ]]; then
              sed -i '' '/^name = "workflow"$/,/^version = /{
                /^version = /s/version = "[^"]*"/version = "'"$NEW_VERSION"'"/
              }' Cargo.lock
            else
              sed -i '/^name = "workflow"$/,/^version = /{
                /^version = /s/version = "[^"]*"/version = "'"$NEW_VERSION"'"/
              }' Cargo.lock
            fi
          fi

          echo "✅ Version updated to $NEW_VERSION in Cargo.toml and Cargo.lock"

      - name: 🔍 Check if version files have changes
        id: check_changes
        if: steps.generate_version.outputs.needs_increment == 'true' && steps.detect_mode.outputs.is_master_branch == 'true'
        shell: bash
        run: |
          # 检查 Cargo.toml 和 Cargo.lock 是否有实际的更改
          if git diff --quiet Cargo.toml Cargo.lock; then
            echo "⚠️  No changes detected in Cargo.toml and Cargo.lock"
            echo "   This usually means:"
            echo "   - Cargo.toml already has the target version"
            echo "   - Cargo.lock is already up to date"
            echo "   - No version increment is needed"
            echo ""
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Changes detected in version files"
            git diff Cargo.toml Cargo.lock
            echo ""
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload updated version files
        if: steps.generate_version.outputs.needs_increment == 'true' && steps.detect_mode.outputs.is_master_branch == 'true' && steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-version-files
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 1

  # 构建所有平台的二进制文件
  build:
    name: 🔨 Build Binaries - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [check-status, update-version]
    # 手动触发/ Master Push: 需要依赖成功
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' && needs.check-status.result == 'success' && needs.update-version.result == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-status.result == 'success' && needs.update-version.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macOS-Intel
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-AppleSilicon
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux-x86_64-static
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: Windows-x86_64-MinGW

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download updated version files
        if: needs.update-version.outputs.needs_increment == 'true' && needs.update-version.outputs.is_master_branch == 'true' && needs.update-version.outputs.has_changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: updated-version-files
          path: .

      - name: 🔍 Get version from update-version job
        id: version
        shell: bash
        run: |
          # 统一从 update-version job 的 outputs 获取版本号
          if [ -n "${{ needs.update-version.outputs.version }}" ]; then
            VERSION="${{ needs.update-version.outputs.version }}"
            TAG="${{ needs.update-version.outputs.tag }}"
            echo "✅ Using version from update-version job: $VERSION ($TAG)"
          else
            echo "❌ Error: Cannot determine version from update-version job"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION"
          echo "✅ Tag: $TAG"

      - name: 🔧 Setup Rust for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 📦 Install MinGW toolchain (Windows)
        if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          # GitHub Actions Windows runner 通常已预装 MinGW
          # 如果没有，可以通过 rustup 安装，或使用预装的工具链
          # 检查 MinGW 是否可用
          if (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue) {
            Write-Host "✅ MinGW toolchain already available"
          } else {
            Write-Host "⚠️  MinGW toolchain not found, attempting to install..."
            # 尝试通过 Chocolatey 安装（如果可用）
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install mingw -y
            } else {
              Write-Host "⚠️  Chocolatey not available, MinGW may need manual installation"
            }
          }

      - name: 📦 Install system dependencies (Linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/dev/shell/deps/install-build.sh

      - name: 📦 Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # 检查 pkg-config 是否已安装，避免重复安装警告
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          else
            echo "✅ pkg-config is already installed"
          fi

      - name: 🔍 Get Cargo.lock hash
        id: cargo_lock
        shell: bash
        run: |
          if [ -f "Cargo.lock" ]; then
            # macOS 使用 shasum，Linux 使用 sha256sum
            if command -v shasum >/dev/null 2>&1; then
              HASH=$(shasum -a 256 Cargo.lock | cut -d' ' -f1 | head -c 16)
            else
              HASH=$(sha256sum Cargo.lock | cut -d' ' -f1 | head -c 16)
            fi
            echo "hash=$HASH" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ steps.cargo_lock.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          enableCrossOsArchive: false

      - name: 🔨 Build binaries
        shell: bash
        run: |
          # 对于 Linux x86_64，设置环境变量以支持 xcb 构建
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            export XCB_PROTO_DIR="${XCB_PROTO_DIR:-/usr/share/xcb}"
            export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            # 确保 PYTHONPATH 包含 xcbgen 模块路径
            if ! python3 -c "import xcbgen" 2>/dev/null; then
              XCBGEN_DIR=$(python3 -c "import xcbgen; import os; print(os.path.dirname(xcbgen.__file__))" 2>/dev/null || find /usr -name "xcbgen" -type d 2>/dev/null | head -1)
              if [ -n "$XCBGEN_DIR" ]; then
                export PYTHONPATH="$(dirname $XCBGEN_DIR):${PYTHONPATH:-}"
              fi
            fi
            # 基本验证
            python3 -c "import xcbgen" || (echo "❌ Error: xcbgen module not available" && exit 1)
            pkg-config --exists xcb || (echo "❌ Error: xcb pkg-config not found" && exit 1)
          fi
          # 构建项目
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            # Linux x86_64 使用详细输出以便调试
            if cargo build --release --target ${{ matrix.target }} --bin workflow --bin install -vv 2>&1 | tee build.log; then
              BUILD_SUCCESS=true
            else
              BUILD_SUCCESS=false
              echo "❌ Build failed. Checking build log for xcb-related errors..."
              grep -i "xcb\|xproto\|xcbgen" build.log | head -20 || true
            fi
          elif [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            # Linux musl 静态链接版本
            echo "🔨 Building for Linux musl (static linking)..."
            if cargo build --release --target ${{ matrix.target }} --bin workflow --bin install; then
              BUILD_SUCCESS=true
            else
              BUILD_SUCCESS=false
              echo "❌ Build failed for Linux musl"
            fi
          else
            # 其他目标（macOS, Windows MSVC, Windows MinGW）
            if cargo build --release --target ${{ matrix.target }} --bin workflow --bin install; then
              BUILD_SUCCESS=true
            else
              BUILD_SUCCESS=false
            fi
          fi

          # 如果构建失败，退出并返回错误码
          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "❌ Build failed"
            exit 1
          fi

      - name: 📦 Create package directory for binaries
        shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/workflow.exe package/
            cp target/${{ matrix.target }}/release/install.exe package/
            echo "✅ Copied workflow.exe and install.exe to package/"
          else
            cp target/${{ matrix.target }}/release/workflow package/
            cp target/${{ matrix.target }}/release/install package/
            echo "✅ Copied workflow and install binaries to package/"
          fi

      - name: 📦 Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archiveName = "workflow-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
          $archivePath = Join-Path $PWD $archiveName
          # 进入 package 目录
          Push-Location package
          try {
            # 打包 workflow.exe 和 install.exe 两个二进制文件
            Compress-Archive -Path "workflow.exe", "install.exe" -DestinationPath $archivePath -Force
            # 显示文件信息
            $fileInfo = Get-Item $archivePath
            Write-Host "📦 Archive created: $archiveName"
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
            # 验证打包内容
            Write-Host "📦 Archive contents:"
            $verifyPath = Join-Path $env:TEMP "workflow-verify"
            Expand-Archive -Path $archivePath -DestinationPath $verifyPath -Force
            Get-ChildItem $verifyPath | ForEach-Object { Write-Host "   $($_.Name)" }
            Remove-Item $verifyPath -Recurse -Force
          } finally {
            Pop-Location
          }

      - name: 📦 Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd package
          ARCHIVE_NAME="workflow-${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz"
          # 打包 workflow 和 install 两个二进制文件
          tar czf "../$ARCHIVE_NAME" workflow install
          cd ..
          ls -lh "$ARCHIVE_NAME"
          # 验证打包内容
          echo "📦 Archive contents:"
          tar tzf "$ARCHIVE_NAME"

      - name: 🐍 Setup Python 3.13
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🔐 Calculate SHA256 checksum for archive
        id: sha256
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ARCHIVE_NAME="workflow-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
            # Windows: 使用 PowerShell 计算 SHA256
            SHA256=$(powershell -Command "(Get-FileHash -Path '$ARCHIVE_NAME' -Algorithm SHA256).Hash.ToLower()")
          else
            ARCHIVE_NAME="workflow-${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz"
            # Linux/macOS: 使用 Python dev 工具
            SHA256=$(python3 scripts/dev/py/dev.py checksum calculate --file "$ARCHIVE_NAME" | tail -1)
          fi
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "$SHA256" > "sha256-${{ matrix.platform }}.txt"

      - name: 📤 Upload build archive to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workflow-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            workflow-${{ steps.version.outputs.version }}-${{ matrix.platform }}.${{ matrix.os == 'windows-latest' && 'zip' || 'tar.gz' }}
          retention-days: 30

      - name: 📤 Upload SHA256 checksum file
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.platform }}
          path: |
            sha256-${{ matrix.platform }}.txt
          retention-days: 30

  # 用户确认是否继续发布流程
  release-confirm:
    name: ⏸️ Release Confirmation
    runs-on: ubuntu-latest
    needs: [update-version, build, check-performance]
    if: |
      needs.update-version.result == 'success' &&
      needs.build.result == 'success' &&
      needs.check-performance.result == 'success'
    environment: release-confirm
    permissions:
      contents: read
    steps:
      - name: ⏸️ Wait for approval
        run: |
          echo "✅ Release confirmation approved"
          echo "   Version: ${{ needs.update-version.outputs.version }}"
          echo "   Tag: ${{ needs.update-version.outputs.tag }}"
          echo "   Build completed successfully"

  # 创建版本更新 PR、合并 PR 并创建 tag（合并后的 job）
  create-tag:
    name: 🏷️ Create Tag & Merge PR
    runs-on: ubuntu-latest
    needs: [update-version, build, release-confirm]
    if: |
      needs.update-version.result == 'success' &&
      needs.build.result == 'success' &&
      needs.release-confirm.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.job_outputs.outputs.tag }}
      version: ${{ steps.job_outputs.outputs.version }}
      tag_created: ${{ steps.job_outputs.outputs.tag_created }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      pr_merged: ${{ steps.handle_pr_merged.outputs.pr_merged || steps.merge_pr.outputs.pr_merged }}
      merge_commit_sha: ${{ steps.get_merge_sha_merged.outputs.merge_commit_sha || steps.get_merge_sha.outputs.merge_commit_sha }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 PAT 以支持推送指向修改了 workflow 文件的 commit 的 tag
          # 当 tag 指向的 commit 修改了 workflow 文件时，GITHUB_TOKEN 无法推送，必须使用 PAT
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: 🔍 Verify Git is available
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            echo "❌ Error: Git is required but not found"
            echo "Installing Git..."
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y git
            elif [[ "${{ runner.os }}" == "macOS" ]]; then
              if ! brew list git >/dev/null 2>&1; then
                brew install git || echo "⚠️  Git installation failed, but may be pre-installed"
              fi
            elif [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "⚠️  Git should be pre-installed on Windows runner"
            fi
          fi
          git --version
          echo "✅ Git is available"

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🔧 Install jq
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          else
            echo "✅ jq is already installed"
          fi
          jq --version

      - name: 📥 Download updated version files
        if: needs.update-version.outputs.needs_increment == 'true' && needs.update-version.outputs.is_master_branch == 'true' && needs.update-version.outputs.has_changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: updated-version-files
          path: .

      # Step 1: Create version update PR (only if needs_increment is true and master branch)
      - name: ⚙️ Configure Git for PR creation
        if: needs.update-version.outputs.needs_increment == 'true' && needs.update-version.outputs.is_master_branch == 'true' && needs.update-version.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🌿 Create version update PR
        id: create_pr
        if: needs.update-version.outputs.needs_increment == 'true' && needs.update-version.outputs.is_master_branch == 'true' && needs.update-version.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py pr create \
            --version "${{ needs.update-version.outputs.version }}" \
            --base master \
            --ci

      # Step 2: Merge version update PR (only if needs_increment is true and master branch and has changes)
      - name: ⏳ Wait for PR status update
        id: wait_pr_status
        if: needs.update-version.outputs.needs_increment == 'true' && needs.update-version.outputs.is_master_branch == 'true' && needs.update-version.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "⏳ Waiting 30s for PR status to be updated and CI to complete..."
          sleep 30

      - name: 🔍 Check PR mergeable status
        id: check_pr_status
        if: needs.update-version.outputs.needs_increment == 'true' && needs.update-version.outputs.is_master_branch == 'true' && needs.update-version.outputs.has_changes == 'true'
        shell: bash
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Error: PR_NUMBER is not set"
            exit 1
          fi

          # 使用 GITHUB_TOKEN 检查 PR 状态（默认 token，有 read 权限）
          PR_STATUS=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")

          MERGED=$(echo "$PR_STATUS" | grep -o '"merged":[^,}]*' | cut -d':' -f2 | tr -d ' "')
          MERGEABLE=$(echo "$PR_STATUS" | grep -o '"mergeable":[^,}]*' | cut -d':' -f2 | tr -d ' "')

          echo "merged=$MERGED" >> $GITHUB_OUTPUT
          echo "mergeable=$MERGEABLE" >> $GITHUB_OUTPUT

      - name: ✅ Handle already merged PR
        id: handle_pr_merged
        if: |
          needs.update-version.outputs.needs_increment == 'true' &&
          needs.update-version.outputs.is_master_branch == 'true' &&
          needs.update-version.outputs.has_changes == 'true' &&
          steps.check_pr_status.outputs.merged == 'true'
        shell: bash
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
          NEW_VERSION="${{ needs.update-version.outputs.version }}"

          echo "✅ PR already merged"
          echo "pr_merged=true" >> $GITHUB_OUTPUT

          # 删除远程分支
          echo "Step 2.2: Deleting remote branch"
          BRANCH_NAME="bump-version-${NEW_VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH_NAME" 2>/dev/null || echo "⚠️  Failed to delete remote branch (may already be deleted)"
          else
            echo "ℹ️  Remote branch already deleted"
          fi

      - name: 🔍 Get merge commit SHA (for already merged PR)
        id: get_merge_sha_merged
        if: |
          needs.update-version.outputs.needs_increment == 'true' &&
          needs.update-version.outputs.is_master_branch == 'true' &&
          needs.update-version.outputs.has_changes == 'true' &&
          steps.handle_pr_merged.outputs.pr_merged == 'true'
        shell: bash
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
          echo "Getting merge commit SHA from PR API..."
          MERGE_SHA_MAX_WAIT=10
          MERGE_SHA_ELAPSED=0
          MERGE_SHA_INTERVAL=1
          MERGE_COMMIT_SHA=""

          while [ $MERGE_SHA_ELAPSED -lt $MERGE_SHA_MAX_WAIT ] && [ -z "$MERGE_COMMIT_SHA" ]; do
            sleep $MERGE_SHA_INTERVAL
            MERGE_SHA_ELAPSED=$((MERGE_SHA_ELAPSED + MERGE_SHA_INTERVAL))

            PR_INFO=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")

            MERGE_COMMIT_SHA=$(echo "$PR_INFO" | jq -r '.merge_commit_sha // empty' 2>/dev/null)
            if [ -n "$MERGE_COMMIT_SHA" ] && [ "$MERGE_COMMIT_SHA" != "null" ]; then
              echo "✅ Got merge commit SHA: $MERGE_COMMIT_SHA (after ${MERGE_SHA_ELAPSED}s)"
              echo "merge_commit_sha=$MERGE_COMMIT_SHA" >> $GITHUB_OUTPUT
              break
            fi
          done

          if [ -z "$MERGE_COMMIT_SHA" ] || [ "$MERGE_COMMIT_SHA" = "null" ]; then
            echo "⚠️  Warning: Could not get merge_commit_sha from PR API after ${MERGE_SHA_MAX_WAIT}s, will use git pull method"
            echo "merge_commit_sha=" >> $GITHUB_OUTPUT
          fi

      - name: ⏳ Wait for PR to be mergeable and merge
        id: wait_and_merge_pr
        if: |
          needs.update-version.outputs.needs_increment == 'true' &&
          needs.update-version.outputs.is_master_branch == 'true' &&
          needs.update-version.outputs.has_changes == 'true' &&
          steps.check_pr_status.outputs.merged != 'true' &&
          (steps.check_pr_status.outputs.mergeable == 'null' || steps.check_pr_status.outputs.mergeable == 'false')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py pr merge \
            --pr-number "${{ steps.create_pr.outputs.pr_number }}" \
            --commit-title "chore: bump version to ${{ needs.update-version.outputs.version }}" \
            --commit-message "Automated version bump to ${{ needs.update-version.outputs.version }}\n\nMerged via GitHub Actions workflow" \
            --ci || true

      - name: 🔀 Merge version update PR
        id: merge_pr
        if: |
          needs.update-version.outputs.needs_increment == 'true' &&
          needs.update-version.outputs.is_master_branch == 'true' &&
          needs.update-version.outputs.has_changes == 'true' &&
          steps.check_pr_status.outputs.merged != 'true' &&
          (steps.wait_and_merge_pr.outputs.pr_merged == 'true' || steps.check_pr_status.outputs.mergeable == 'true')
        shell: bash
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
          NEW_VERSION="${{ needs.update-version.outputs.version }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Step 2: Merging version update PR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "ℹ️  Using GITHUB_TOKEN to merge PR (workflow has pull-requests: write permission)"
          echo "🔀 Attempting to merge PR #$PR_NUMBER..."

          # 尝试合并（使用 GITHUB_TOKEN，workflow 有 pull-requests: write 权限）
          MERGE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
            -d '{
              "commit_title": "chore: bump version to '"$NEW_VERSION"'",
              "commit_message": "Automated version bump to '"$NEW_VERSION"'\n\nMerged via GitHub Actions workflow",
              "merge_method": "squash"
            }')

          MERGE_CODE=$(echo "$MERGE_RESPONSE" | tail -n1)
          MERGE_BODY=$(echo "$MERGE_RESPONSE" | head -n-1)

          if [ "$MERGE_CODE" = "200" ]; then
            echo "✅ PR merged successfully"
            echo "pr_merged=true" >> $GITHUB_OUTPUT
          elif [ "$MERGE_CODE" = "405" ]; then
            echo "⚠️  PR not ready to merge yet (HTTP 405), but continuing..."
            echo "pr_merged=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to merge PR (HTTP $MERGE_CODE)"
            echo "Response: $MERGE_BODY" | jq '.' 2>/dev/null || echo "$MERGE_BODY"
            exit 1
          fi

      - name: 🔍 Get merge commit SHA (for merged PR)
        id: get_merge_sha
        if: |
          needs.update-version.outputs.needs_increment == 'true' &&
          needs.update-version.outputs.is_master_branch == 'true' &&
          needs.update-version.outputs.has_changes == 'true' &&
          (steps.handle_pr_merged.outputs.pr_merged == 'true' || steps.merge_pr.outputs.pr_merged == 'true' || steps.wait_and_merge_pr.outputs.pr_merged == 'true')
        shell: bash
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
          echo "Getting merge commit SHA from PR API..."
          MERGE_SHA_MAX_WAIT=10
          MERGE_SHA_ELAPSED=0
          MERGE_SHA_INTERVAL=1
          MERGE_COMMIT_SHA=""

          while [ $MERGE_SHA_ELAPSED -lt $MERGE_SHA_MAX_WAIT ] && [ -z "$MERGE_COMMIT_SHA" ]; do
            sleep $MERGE_SHA_INTERVAL
            MERGE_SHA_ELAPSED=$((MERGE_SHA_ELAPSED + MERGE_SHA_INTERVAL))

            PR_INFO=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")

            MERGE_COMMIT_SHA=$(echo "$PR_INFO" | jq -r '.merge_commit_sha // empty' 2>/dev/null)
            if [ -n "$MERGE_COMMIT_SHA" ] && [ "$MERGE_COMMIT_SHA" != "null" ]; then
              echo "✅ Got merge commit SHA: $MERGE_COMMIT_SHA (after ${MERGE_SHA_ELAPSED}s)"
              echo "merge_commit_sha=$MERGE_COMMIT_SHA" >> $GITHUB_OUTPUT
              break
            fi
          done

          if [ -z "$MERGE_COMMIT_SHA" ] || [ "$MERGE_COMMIT_SHA" = "null" ]; then
            echo "⚠️  Warning: Could not get merge_commit_sha from PR API after ${MERGE_SHA_MAX_WAIT}s, will use git pull method"
            echo "merge_commit_sha=" >> $GITHUB_OUTPUT
          fi

      - name: 🗑️ Delete remote branch
        id: delete_branch
        if: |
          needs.update-version.outputs.needs_increment == 'true' &&
          needs.update-version.outputs.is_master_branch == 'true' &&
          needs.update-version.outputs.has_changes == 'true' &&
          (steps.handle_pr_merged.outputs.pr_merged == 'true' || steps.merge_pr.outputs.pr_merged == 'true')
        shell: bash
        run: |
          NEW_VERSION="${{ needs.update-version.outputs.version }}"
          BRANCH_NAME="bump-version-${NEW_VERSION}"

          echo "Step 2.2: Deleting remote branch"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH_NAME" 2>/dev/null || echo "⚠️  Failed to delete remote branch (may already be deleted)"
          else
            echo "ℹ️  Remote branch already deleted"
          fi

      # Step 3: Create and push tag
      - name: ⚙️ Configure Git for tag creation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🏷️ Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          TAG="${{ needs.update-version.outputs.tag }}"
          IS_MASTER="${{ needs.update-version.outputs.is_master_branch }}"
          NEEDS_INCREMENT="${{ needs.update-version.outputs.needs_increment }}"

          # Master 分支：如果 PR 已合并，使用 merge_commit_sha
          if [ "$IS_MASTER" == "true" ] && [ "$NEEDS_INCREMENT" == "true" ]; then
            MERGE_COMMIT_SHA="${{ steps.get_merge_sha_merged.outputs.merge_commit_sha || steps.get_merge_sha.outputs.merge_commit_sha }}"
            if [ -n "$MERGE_COMMIT_SHA" ] && [ "$MERGE_COMMIT_SHA" != "null" ]; then
              # 验证该 commit 是否存在
              if ! git cat-file -e "$MERGE_COMMIT_SHA" 2>/dev/null; then
                # 尝试获取 commit
                git fetch origin "$MERGE_COMMIT_SHA" 2>/dev/null || \
                git fetch origin "+refs/heads/*:refs/remotes/origin/*" 2>/dev/null || true
              fi
              # 使用 Python dev 工具
              python3 scripts/dev/py/dev.py tag create \
                --tag "$TAG" \
                --commit "$MERGE_COMMIT_SHA" \
                --ci
            else
              # 如果没有 merge_commit_sha，使用当前 HEAD
              python3 scripts/dev/py/dev.py tag create \
                --tag "$TAG" \
                --ci
            fi
          else
            # 非 Master 分支：使用当前 HEAD
            python3 scripts/dev/py/dev.py tag create \
              --tag "$TAG" \
              --ci
          fi

      # Step 4: Set job outputs
      - name: 📊 Set job outputs for downstream jobs
        id: job_outputs
        shell: bash
        run: |
          VERSION="${{ needs.update-version.outputs.version }}"
          TAG="${{ needs.update-version.outputs.tag }}"
          IS_MASTER="${{ needs.update-version.outputs.is_master_branch }}"
          NEEDS_INCREMENT="${{ needs.update-version.outputs.needs_increment }}"

          # 检查是否创建了新 tag
          if [ "$IS_MASTER" == "true" ]; then
            # Master 分支：检查是否创建了新 tag
            if [ "$NEEDS_INCREMENT" == "true" ]; then
              # 需要递增版本号，会创建新 tag
              TAG_CREATED="true"
            else
              # 检查 tag 是否已存在
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                TAG_CREATED="false"
              else
                TAG_CREATED="true"
              fi
            fi
          else
            # 非 Master 分支：检查 tag 是否已存在
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG_CREATED="false"
              echo "ℹ️  Tag already exists: $TAG"
            else
              TAG_CREATED="true"
              echo "ℹ️  Created new pre-release tag: $TAG"
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tag_created=$TAG_CREATED" >> $GITHUB_OUTPUT
          echo "✅ Job outputs set: version=$VERSION, tag=$TAG, tag_created=$TAG_CREATED"

  # 创建 GitHub Release
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [update-version, create-tag, build, release-confirm]
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' && needs.update-version.result == 'success' && needs.create-tag.result == 'success' && needs.build.result == 'success' && needs.release-confirm.result == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.update-version.result == 'success' && needs.create-tag.result == 'success' && needs.build.result == 'success' && needs.release-confirm.result == 'success' && needs.create-tag.outputs.tag_created == 'true')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Get version and tag from previous jobs
        id: version
        shell: bash
        run: |
          VERSION="${{ needs.update-version.outputs.version }}"
          # 如果 create-tag job 成功运行，使用其 outputs；否则使用 update-version 的 outputs
          if [ "${{ needs.create-tag.result }}" == "success" ] && [ -n "${{ needs.create-tag.outputs.tag }}" ]; then
            TAG="${{ needs.create-tag.outputs.tag }}"
            echo "✅ Using tag from create-tag job: $TAG"
          else
            TAG="${{ needs.update-version.outputs.tag }}"
            echo "✅ Using tag from update-version job: $TAG"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION"
          echo "✅ Tag: $TAG"

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📝 Prepare release info
        id: release_info
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_MASTER="${{ needs.update-version.outputs.is_master_branch }}"

          if [ "$IS_MASTER" == "true" ]; then
            RELEASE_NAME="Release $VERSION"
            RELEASE_BODY="## Release $VERSION

            See the [changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details."
          else
            RELEASE_NAME="Pre-release $VERSION"
            RELEASE_BODY="## Pre-release $VERSION

            ⚠️ **This is a pre-release version** (alpha build)

            See the [changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details."
          fi

          # 使用多行输出（使用 EOF 分隔符）
          {
            echo "name<<EOF"
            echo "$RELEASE_NAME"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "body<<EOF"
            echo "$RELEASE_BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "✅ Release name: $RELEASE_NAME"
          echo "✅ Is pre-release: $([ "$IS_MASTER" != "true" ] && echo "true" || echo "false")"

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: ${{ steps.release_info.outputs.body }}
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ needs.update-version.outputs.is_master_branch != 'true' }}

  # 更新 Homebrew Formula
  # 注意：只在 master 分支的 push 事件时更新，非 master 分支不更新
  update-homebrew:
    name: 🍺 Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [update-version, create-tag, build, release]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.update-version.result == 'success' && needs.create-tag.result == 'success' && needs.build.result == 'success' && needs.release.result == 'success' && needs.create-tag.outputs.tag_created == 'true')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Get version and tag from previous jobs
        id: version
        shell: bash
        run: |
          VERSION="${{ needs.update-version.outputs.version }}"
          # 如果 create-tag job 成功运行，使用其 outputs；否则使用 update-version 的 outputs
          if [ "${{ needs.create-tag.result }}" == "success" ] && [ -n "${{ needs.create-tag.outputs.tag }}" ]; then
            TAG="${{ needs.create-tag.outputs.tag }}"
            echo "✅ Using tag from create-tag job: $TAG"
          else
            TAG="${{ needs.update-version.outputs.tag }}"
            echo "✅ Using tag from update-version job: $TAG"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION"
          echo "✅ Tag: $TAG"

      - name: 📥 Checkout homebrew-workflow
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-workflow
          token: ${{ secrets.WORKFLOW_PAT }}
          path: homebrew-workflow

      - name: 📝 Generate Formula file and update
        working-directory: homebrew-workflow
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py homebrew update \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --formula-path Formula/workflow.rb \
            --template-path Formula/workflow.rb.template \
            --repo "${{ github.repository }}" \
            --commit \
            --push

  # 清理已合并分支的 alpha tag
  # 当 PR 合并到 master 后，清理指向已合并提交的 alpha tag
  cleanup-alpha-tags:
    name: 🧹 Cleanup Alpha Tags
    runs-on: ubuntu-latest
    needs: [create-tag]
    # 只在 master 分支的 push 事件时运行，且 create-tag job 成功
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.create-tag.result == 'success' &&
      needs.create-tag.outputs.pr_merged == 'true'
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 PAT 以支持删除 tag
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🧹 Cleanup Alpha Tags
        id: cleanup
        run: |
          MERGE_COMMIT_SHA="${{ needs.create-tag.outputs.merge_commit_sha }}"

          if [ -z "$MERGE_COMMIT_SHA" ]; then
            echo "⚠️  No merge commit SHA found, skipping cleanup"
            exit 0
          fi

          CURRENT_VERSION="${{ needs.create-tag.outputs.version }}"
          # 使用 Python dev 工具
          python3 scripts/dev/py/dev.py tag cleanup \
            --merge-commit "$MERGE_COMMIT_SHA" \
            --version "$CURRENT_VERSION" \
            --ci

