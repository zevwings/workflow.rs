# Rustfmt 配置文件
# 用于统一代码格式化规则
# 只使用稳定版本支持的功能

# Rust 版本（用于兼容性）
edition = "2021"

# 缩进设置（4 个空格，与 .editorconfig 保持一致）
tab_spaces = 4

# 行宽设置（100 字符，与 .editorconfig 保持一致）
max_width = 100

# 换行设置（Unix 风格，与 .editorconfig 保持一致）
newline_style = "Unix"

# 数组格式化
array_width = 60

# 链式调用格式化
chain_width = 80

# 导入相关配置
# 自动重新排序导入（按字母顺序）
# 注意：这是稳定版支持的功能
reorder_imports = true

# 注意：以下功能需要 nightly 版本，当前项目使用稳定版，因此不启用
# group_imports = "StdExternalCrate"  # 需要 nightly
# imports_granularity = "Crate"        # 需要 nightly
#
# 如果需要使用这些功能，可以：
# 1. 切换到 nightly 工具链
# 2. 或手动维护导入顺序（标准库 → 第三方库 → 项目内部）
