[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/services",
    "crates/app",
    "crates/toolkit",
    "crates/prompt",
    "crates/registry",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
anymap2 = "0.13"
once_cell = "1.5"

# 开发环境：使用本地 path 依赖（默认）
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
services = { path = "crates/services" }
toolkit = { path = "crates/toolkit" }
prompt = { path = "crates/prompt" }
registry = { path = "crates/registry" }
