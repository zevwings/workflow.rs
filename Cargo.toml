[workspace]
members = [
    "crates/client",
    "crates/domain",
    "crates/http",
    "crates/infra",
    "crates/llm",
    "crates/storage",
    "crates/services",
    "crates/app",
    "crates/toolkit",
    "crates/prompt",
    "crates/di",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"

[workspace.dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
toml = "0.8"

# 错误处理
thiserror = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5"

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "rustls-tls"], default-features = false }

# Git
git2 = { version = "0.20.3", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

# Shell 命令执行
duct = "0.13"

# URL 解析
url = "2.5"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# 工具库
anymap2 = "0.13"
once_cell = "1.19"
regex = "1.10"
chrono = "0.4"
dirs = "5.0"
base64 = "0.22"
zip = "0.6"
flate2 = "1.0"
walkdir = "2.4"
tar = "0.4"
which = "6.0"
wait-timeout = "0.2"
glob = "0.3"
rand = "0.9"
sha2 = "0.10"
open = "5.0"
handlebars = "5.0"
shellexpand = "3.1"
whattheshell = "1.1"
dashmap = "6.1"
clipboard = "0.5"
rayon = "1.10"

# 终端控制
crossterm = "0.28"
unicode-width = "0.1"
fuzzy-matcher = "0.3"

# dev-dependencies
rstest = "0.19"
pretty_assertions = "1.4"
tempfile = "3.10"
serial_test = "3.2"
criterion = { version = "0.5", features = ["html_reports"] }
mockito = "1.2"
insta = { version = "1.38", features = ["json"] }

# 内部 crate 依赖
client = { path = "crates/client" }
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
storage = { path = "crates/storage" }
services = { path = "crates/services" }
toolkit = { path = "crates/toolkit" }
prompt = { path = "crates/prompt" }
di = { path = "crates/di" }
http = { path = "crates/http" }
llm = { path = "crates/llm" }

[workspace.metadata.tarpaulin]
# 覆盖率目标
target-coverage = 80.0

# 排除文件
exclude-files = [
    "src/bin/*",
    "tests/*",
    "benches/*",
    "*/testing/*",
    "*/mock/*",
]

# 输出格式
output = ["Html", "Lcov", "Json"]

# 输出目录
out = "coverage/"

# 运行类型
run-types = ["Tests", "Doctests"]

# 超时设置（秒）
timeout = 300

# 详细输出
verbose = true
