[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/services",
    "crates/app",
    "crates/toolkit",
    "crates/prompt",
    "crates/registry",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"

[workspace.dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
toml = "0.8"

# 错误处理
thiserror = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5"

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "rustls-tls"], default-features = false }

# Git
git2 = { version = "0.20.3", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

# Shell 命令执行
duct = "0.13"

# 工具库
anymap2 = "0.13"
once_cell = "1.19"
regex = "1.10"
chrono = "0.4"
dirs = "5.0"
base64 = "0.22"
zip = "0.6"
flate2 = "1.0"
walkdir = "2.4"
tar = "0.4"

# dev-dependencies
rstest = "0.19"
pretty_assertions = "1.4"
tempfile = "3.10"
serial_test = "3.2"
criterion = { version = "0.5", features = ["html_reports"] }

# 开发环境：使用本地 path 依赖（默认）
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
services = { path = "crates/services" }
toolkit = { path = "crates/toolkit" }
prompt = { path = "crates/prompt" }
registry = { path = "crates/registry" }
