[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "应用层（Application Layer），CLI 应用程序入口和命令处理"
default-run = "workflow"

[features]
default = ["develop"]
# 开发用命令（如 check），release 构建时可通过 --no-default-features 排除以减小 bin 体积
develop = []

[[bin]]
name = "workflow"
path = "src/bin/workflow.rs"

[[bin]]
name = "install"
path = "src/bin/install.rs"

[dependencies]
domain.workspace = true
services.workspace = true
storage.workspace = true
client.workspace = true
infra.workspace = true
toolkit.workspace = true
prompt.workspace = true
di.workspace = true
once_cell.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
git2.workspace = true

[[bench]]
name = "cli_startup"
harness = false

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
