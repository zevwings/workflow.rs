[package]
name = "toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "工具包（Toolkit），提供通用工具、HTTP 客户端、日志、交互式提示等基础设施"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true

# HTTP 客户端
reqwest.workspace = true

# 重试机制
backon = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Shell 自动补全
clap_complete.workspace = true
whattheshell = "1.1"    # Shell 检测（通过进程树推断当前 shell）

# Shell 命令执行
duct.workspace = true

# 工具
rand = "0.9"
base64.workspace = true
regex.workspace = true
open = "5.0"
zip.workspace = true
flate2.workspace = true
walkdir.workspace = true
tar.workspace = true
sha2 = "0.10"
dirs.workspace = true
chrono.workspace = true
toml.workspace = true
handlebars = "5.0"
shellexpand = "3.1"

# clipboard 依赖：在 musl 和 Linux ARM64 目标上禁用
[target.'cfg(all(not(target_env = "musl"), not(all(target_arch = "aarch64", target_os = "linux", target_env = "gnu"))))'.dependencies]
clipboard = "0.5"

[dev-dependencies]
mockito = "1.2"
tempfile.workspace = true
rstest.workspace = true
pretty_assertions.workspace = true
serial_test.workspace = true
