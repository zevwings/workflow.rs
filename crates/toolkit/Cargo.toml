[package]
name = "toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "工具包（Toolkit），提供通用工具、HTTP 客户端、日志、交互式提示等基础设施"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "rustls-tls"], default-features = false }

# 重试机制
backon = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Shell 自动补全
clap_complete = "4.5"
whattheshell = "1.1"    # Shell 检测（通过进程树推断当前 shell）

# Shell 命令执行
duct = "0.13"

# 工具
base64 = "0.22"
regex = "1.10"
open = "5.0"
zip = "0.6"
flate2 = "1.0"
walkdir = "2.4"
tar = "0.4"
sha2 = "0.10"
dirs = "5.0"
chrono = "0.4"
toml = "0.8"
serde_with = "3.0"
handlebars = "5.0"
shellexpand = "3.1"

# clipboard 依赖：在 musl 和 Linux ARM64 目标上禁用
[target.'cfg(all(not(target_env = "musl"), not(all(target_arch = "aarch64", target_os = "linux", target_env = "gnu"))))'.dependencies]
clipboard = "0.5"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.10"
rstest = "0.19"
pretty_assertions = "1.4"
serial_test = "3.0"
